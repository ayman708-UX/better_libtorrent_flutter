name: Release Native Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    uses: ./.github/workflows/build-android.yml
  build-ios:
    uses: ./.github/workflows/build-ios.yml
  build-macos:
    uses: ./.github/workflows/build-macos.yml
  build-windows:
    uses: ./.github/workflows/build-windows.yml
  build-linux:
    uses: ./.github/workflows/build-linux.yml

  publish-release:
    needs: [build-android, build-ios, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package Release Zips
        run: |
          mkdir -p release_out
          cd artifacts
          
          # Android
          zip -r ../release_out/torrent_engine-android.zip engine-android-*
          
          # iOS
          zip -r ../release_out/torrent_engine-ios.zip final-ios/TorrentEngine.xcframework
          
          # macOS
          zip -r ../release_out/torrent_engine-macos.zip final-macos/TorrentEngineMac.xcframework
          
          # Windows
          zip -r ../release_out/torrent_engine-windows.zip engine-VC-WIN64A
          
          # Linux
          zip -r ../release_out/torrent_engine-linux.zip engine-linux-*
          
          cd ../release_out
          sha256sum *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
