name: Build macOS Deps

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [darwin64-arm64-cc, darwin64-x86_64-cc]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build OpenSSL
        run: |
          bash build_scripts/build_openssl.sh --target=${{ matrix.target }} --output=$PWD/out/macos/${{ matrix.target }}
      - name: Build libdatachannel
        run: |
          bash build_scripts/build_libdatachannel.sh --target=${{ matrix.target }} --output=$PWD/out/macos/${{ matrix.target }}
      - name: Build libtorrent and Engine
        run: |
          bash build_scripts/build_libtorrent.sh --target=${{ matrix.target }} --deps=$PWD/out/macos/${{ matrix.target }} --output=$PWD/out/final/macos/${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-macos-${{ matrix.target }}
          path: out/final/macos/${{ matrix.target }}

  package-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: Download all macOS engine artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: engine-macos-*
          path: out/
      - name: Create macOS XCFramework
        run: |
          # We can create a universal library first or pass multiple libraries to xcodebuild.
          # Passing multiple to xcodebuild for macOS might complain if they are the same platform,
          # so lipo is better for macOS universal binary.
          lipo -create out/engine-macos-darwin64-arm64-cc/bin/libtorrent_engine.a out/engine-macos-darwin64-x86_64-cc/bin/libtorrent_engine.a -output libtorrent_engine_mac.a
          xcodebuild -create-xcframework \
            -library libtorrent_engine_mac.a \
            -output TorrentEngineMac.xcframework
      - name: Upload macOS XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: final-macos
          path: TorrentEngineMac.xcframework
