// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.example.better_libtorrent_flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.example.better_libtorrent_flutter"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin, ONLY if buildFromSource is passed.
    // Otherwise, we assume the prebuilt jniLibs are already populated (by Phase 8).
    if (project.hasProperty('buildFromSource')) {
        externalNativeBuild {
            cmake {
                path = "../src/CMakeLists.txt"
                // The default CMake version for the Android Gradle Plugin is 3.10.2.
                // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
                //
                // The Flutter tooling requires that developers have CMake 3.10 or later
                // installed. You should not increase this version, as doing so will cause
                // the plugin to fail to compile for some customers of the plugin.
                // version "3.10.2"
            }
        }
    } else {
        // Download prebuilt artifact
        task downloadNativeLibs {
            doLast {
                def version = "0.0.4"
                def zipUrl = "https://github.com/ayman708-UX/better_libtorrent_flutter/releases/download/v0.0.4/torrent_engine-android.zip"
                def zipFile = new File(project.buildDir, "torrent_engine-android.zip")
                def extractDir = new File(project.projectDir, "src/main/jniLibs")

                if (!new File(extractDir, "armeabi-v7a/libtorrent_engine.so").exists()) {
                    println "Downloading prebuilt Android binaries from ${zipUrl}..."
                    zipFile.parentFile.mkdirs()
                    new URL(zipUrl).withInputStream { i -> zipFile.withOutputStream { it << i } }

                    println "Extracting to ${extractDir}..."
                    copy {
                        from zipTree(zipFile)
                        into extractDir
                    }
                    
                    // The zip contains folders like engine-android-android-arm, engine-android-android-arm64, etc.
                    // We need to rename them to Android ABI folder names.
                    file("${extractDir}/engine-android-android-arm").renameTo(file("${extractDir}/armeabi-v7a"))
                    file("${extractDir}/engine-android-android-arm64").renameTo(file("${extractDir}/arm64-v8a"))
                    file("${extractDir}/engine-android-android-x86_64").renameTo(file("${extractDir}/x86_64"))
                }
            }
        }
        preBuild.dependsOn(downloadNativeLibs)
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}
